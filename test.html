<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveChat API — Dev Test Client</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --bg2:       #1a1d27;
      --bg3:       #22263a;
      --border:    #2e3348;
      --text:      #e2e4f0;
      --muted:     #7b82a0;
      --accent:    #4f8ef7;
      --accent2:   #7c5ef7;
      --green:     #3dd68c;
      --amber:     #f5a623;
      --red:       #f25c5c;
      --teal:      #3dd6c8;
      --radius:    10px;
      --font:      'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      height: 100vh;
      display: grid;
      grid-template-rows: 56px 1fr;
      grid-template-columns: 320px 1fr;
      grid-template-areas:
        "header header"
        "sidebar  main";
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      grid-area: header;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
    }
    header h1 { font-size: 15px; font-weight: 600; color: var(--text); }
    header .badge {
      font-size: 11px;
      background: var(--bg3);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 99px;
      color: var(--muted);
    }
    #conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      margin-left: auto;
      transition: background 0.3s;
    }
    #conn-dot.connected    { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #conn-dot.connecting   { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    #conn-dot.disconnected { background: var(--red); }
    #conn-label { font-size: 12px; color: var(--muted); }

    /* ── Sidebar ── */
    aside {
      grid-area: sidebar;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
      overflow-y: auto;
    }

    .panel-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    input[type="text"], textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 60px; }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 14px;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary   { background: var(--accent);  color: #fff; }
    .btn-secondary { background: var(--bg3);      color: var(--text); border: 1px solid var(--border); }
    .btn-danger    { background: var(--red);       color: #fff; }
    .btn-success   { background: var(--green);     color: #111; }
    .btn-voice     { background: var(--bg3); color: var(--text); border: 1px solid var(--border); position: relative; }
    .btn-voice.recording { background: var(--red); color: #fff; border-color: var(--red); animation: pulse 1.2s ease-in-out infinite; }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(242,92,92,0.4); }
      50%      { box-shadow: 0 0 0 6px rgba(242,92,92,0); }
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .toggle-row span { font-size: 13px; color: var(--text); }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 38px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 99px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(16px); }

    /* Level meter */
    #mic-level {
      height: 4px;
      background: var(--bg3);
      border-radius: 99px;
      overflow: hidden;
    }
    #mic-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--amber), var(--red));
      transition: width 0.05s;
    }

    .divider { height: 1px; background: var(--border); }

    /* Session info */
    .info-grid { display: grid; gap: 4px; }
    .info-row  { display: flex; justify-content: space-between; font-size: 12px; }
    .info-row .key   { color: var(--muted); }
    .info-row .value { color: var(--text); font-family: monospace; font-size: 11px; word-break: break-all; }

    /* ── Main area ── */
    main {
      grid-area: main;
      display: flex;
      flex-direction: column;
    }

    /* Chat messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .msg.user        { background: var(--accent);  color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
    .msg.assistant   { background: var(--bg3);      color: var(--text); align-self: flex-start; border-bottom-left-radius: 3px; border: 1px solid var(--border); }
    .msg.transcript  { background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 12px; align-self: flex-start; font-style: italic; }
    .msg.tool        { background: var(--bg2); border: 1px solid var(--teal); color: var(--teal); font-family: monospace; font-size: 11px; align-self: flex-start; max-width: 90%; white-space: pre-wrap; border-radius: 8px; }
    .msg.system      { background: transparent; color: var(--muted); font-size: 12px; align-self: center; text-align: center; }
    .msg.error-msg   { background: rgba(242,92,92,0.1); border: 1px solid var(--red); color: var(--red); align-self: center; font-size: 12px; }

    .msg-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
      opacity: 0.7;
    }

    /* Text input area */
    #input-area {
      padding: 16px 20px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #text-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 42px;
      line-height: 1.5;
    }
    #text-input:focus { border-color: var(--accent); }
    #text-input::placeholder { color: var(--muted); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<header>
  <h1>LiveChat API</h1>
  <span class="badge">Dev Test Client</span>
  <div id="conn-dot"></div>
  <span id="conn-label">Disconnected</span>
</header>

<!-- ── Sidebar ─────────────────────────────────────────── -->
<aside>

  <!-- Connection -->
  <section>
    <div class="panel-title">Connection</div>
    <label>WebSocket URL</label>
    <input type="text" id="ws-url" value="ws://localhost:8000/v1/chat">
    <br>
    <label>API Key <span style="color:var(--muted)">(not validated yet)</span></label>
    <input type="text" id="api-key" value="test_key_123" placeholder="pk_live_...">
    <br>
    <label>Session ID <span style="color:var(--muted)">(leave blank for new)</span></label>
    <input type="text" id="session-id" placeholder="Auto-generated">
    <br>
    <div class="row">
      <button class="btn-primary"  id="btn-connect">Connect</button>
      <button class="btn-secondary" id="btn-disconnect" disabled>Disconnect</button>
    </div>
  </section>

  <div class="divider"></div>

  <!-- Voice -->
  <section>
    <div class="panel-title">Voice</div>
    <button class="btn-voice" id="btn-voice" disabled>🎙 Hold to Talk</button>
    <br>
    <div id="mic-level"><div id="mic-bar"></div></div>
    <br>
    <div class="toggle-row">
      <span>🔊 Speaker (audio output)</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-speaker">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <div class="divider"></div>

  <!-- Session info -->
  <section>
    <div class="panel-title">Session Info</div>
    <div class="info-grid">
      <div class="info-row"><span class="key">Session ID</span><span class="value" id="info-session">—</span></div>
      <div class="info-row"><span class="key">Project</span><span class="value" id="info-project">—</span></div>
      <div class="info-row"><span class="key">Speaker</span><span class="value" id="info-speaker">off</span></div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- Controls -->
  <section>
    <div class="panel-title">Controls</div>
    <button class="btn-secondary" id="btn-clear" style="width:100%">Clear log</button>
  </section>

</aside>

<!-- ── Main ─────────────────────────────────────────────── -->
<main>
  <div id="messages">
    <div class="msg system">Connect to start chatting.</div>
  </div>

  <div id="input-area">
    <textarea id="text-input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" disabled></textarea>
    <button class="btn-primary" id="btn-send" disabled>Send</button>
  </div>
</main>

<script>
// ─────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────
let ws            = null;
let audioCtx      = null;
let mediaStream   = null;
let scriptProc    = null;
let isRecording   = false;
let speakerOn     = false;
let nextPlayAt    = 0;     // scheduled end of last queued audio chunk

// ─────────────────────────────────────────────────────────────
// DOM refs
// ─────────────────────────────────────────────────────────────
const $url        = document.getElementById('ws-url');
const $apiKey     = document.getElementById('api-key');
const $sessionId  = document.getElementById('session-id');
const $btnConnect = document.getElementById('btn-connect');
const $btnDisc    = document.getElementById('btn-disconnect');
const $btnVoice   = document.getElementById('btn-voice');
const $btnSend    = document.getElementById('btn-send');
const $textInput  = document.getElementById('text-input');
const $messages   = document.getElementById('messages');
const $micBar     = document.getElementById('mic-bar');
const $togSpk     = document.getElementById('toggle-speaker');
const $connDot    = document.getElementById('conn-dot');
const $connLabel  = document.getElementById('conn-label');
const $infoSess   = document.getElementById('info-session');
const $infoProj   = document.getElementById('info-project');
const $infoSpk    = document.getElementById('info-speaker');
const $btnClear   = document.getElementById('btn-clear');

// ─────────────────────────────────────────────────────────────
// Connection
// ─────────────────────────────────────────────────────────────
$btnConnect.addEventListener('click', connect);
$btnDisc.addEventListener('click', disconnect);

function buildUrl() {
  const base    = $url.value.trim();
  const key     = $apiKey.value.trim();
  const session = $sessionId.value.trim();
  let url = `${base}?api_key=${encodeURIComponent(key)}`;
  if (session) url += `&session_id=${encodeURIComponent(session)}`;
  return url;
}

function connect() {
  if (ws) return;
  const url = buildUrl();
  setStatus('connecting');
  logSystem(`Connecting to ${url}…`);

  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    setStatus('connected');
    setUIConnected(true);
    logSystem('WebSocket connected.');
  };

  ws.onmessage = (evt) => {
    if (evt.data instanceof ArrayBuffer) {
      // Binary: PCM audio
      if (speakerOn) scheduleAudio(evt.data);
    } else {
      handleJson(JSON.parse(evt.data));
    }
  };

  ws.onclose = () => {
    setStatus('disconnected');
    setUIConnected(false);
    stopVoice(false);
    ws = null;
    logSystem('WebSocket disconnected.');
  };

  ws.onerror = () => {
    logSystem('WebSocket error — check console.', true);
  };
}

function disconnect() {
  stopVoice(true);
  if (ws) { ws.close(); ws = null; }
}

// ─────────────────────────────────────────────────────────────
// JSON frame handler
// ─────────────────────────────────────────────────────────────
function handleJson(msg) {
  switch (msg.type) {
    case 'session_ready':
      $sessionId.value = msg.session_id;
      $infoSess.textContent = msg.session_id;
      $infoProj.textContent = msg.project_name || msg.project_id || '—';
      $infoSpk.textContent  = msg.speaker_mode ? 'on' : 'off';
      speakerOn = msg.speaker_mode;
      $togSpk.checked = speakerOn;
      logSystem(`Session ready · ${msg.session_id}`);
      break;

    case 'assistant_text':
      appendMsg('assistant', 'Assistant', msg.text);
      break;

    case 'user_transcript':
      appendMsg('transcript', '🎙 Transcript', msg.text);
      break;

    case 'tool_call':
      appendMsg('tool', '⚙ Tool call', formatTool(msg));
      break;

    case 'turn_complete':
      logSystem('— turn complete —');
      break;

    case 'speaker_mode_updated':
      speakerOn = msg.enabled;
      $infoSpk.textContent = speakerOn ? 'on' : 'off';
      logSystem(`Speaker mode: ${speakerOn ? 'ON' : 'OFF'}`);
      if (!speakerOn) nextPlayAt = 0; // flush scheduled audio
      break;

    case 'error':
      logError(msg.message);
      break;

    case 'session_ended':
      logSystem('Session ended by server.');
      break;

    case 'pong':
      logSystem('pong');
      break;

    default:
      logSystem(`Unknown frame: ${JSON.stringify(msg)}`);
  }
}

function formatTool(msg) {
  return [
    `tool:   ${msg.tool}`,
    `args:   ${JSON.stringify(msg.args,  null, 2)}`,
    `result: ${JSON.stringify(msg.result, null, 2)}`,
  ].join('\n');
}

function send(obj) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify(obj));
}

// ─────────────────────────────────────────────────────────────
// Text input
// ─────────────────────────────────────────────────────────────
$btnSend.addEventListener('click', sendText);
$textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});
// Auto-resize textarea
$textInput.addEventListener('input', () => {
  $textInput.style.height = 'auto';
  $textInput.style.height = Math.min($textInput.scrollHeight, 120) + 'px';
});

function sendText() {
  const text = $textInput.value.trim();
  if (!text) return;
  appendMsg('user', 'You', text);
  send({ type: 'text_input', text });
  $textInput.value = '';
  $textInput.style.height = 'auto';
}

// ─────────────────────────────────────────────────────────────
// Voice  (push-to-talk via mousedown / touchstart)
// ─────────────────────────────────────────────────────────────
$btnVoice.addEventListener('mousedown',  startVoice);
$btnVoice.addEventListener('touchstart', startVoice, { passive: true });
$btnVoice.addEventListener('mouseup',    () => stopVoice(true));
$btnVoice.addEventListener('mouseleave', () => { if (isRecording) stopVoice(true); });
$btnVoice.addEventListener('touchend',   () => stopVoice(true));

async function startVoice(e) {
  e?.preventDefault();
  if (isRecording || !ws) return;

  try {
    if (!audioCtx || audioCtx.state === 'closed') {
      audioCtx = new AudioContext({ sampleRate: 48000 });
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 48000 }
    });

    const source = audioCtx.createMediaStreamSource(mediaStream);
    // ScriptProcessorNode — deprecated but universally supported for a dev tool
    scriptProc = audioCtx.createScriptProcessor(4096, 1, 1);
    source.connect(scriptProc);
    scriptProc.connect(audioCtx.destination);

    isRecording = true;
    $btnVoice.classList.add('recording');
    $btnVoice.textContent = '🔴 Recording…';

    send({ type: 'voice_start' });

    scriptProc.onaudioprocess = (e) => {
      if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;

      const float32   = e.inputBuffer.getChannelData(0);
      const resampled = downsampleTo16k(float32, 48000);
      const pcm16     = floatToInt16(resampled);

      // Update level meter
      const rms = Math.sqrt(float32.reduce((a, v) => a + v * v, 0) / float32.length);
      $micBar.style.width = Math.min(rms * 600, 100) + '%';

      ws.send(pcm16.buffer);
    };

  } catch (err) {
    logError(`Microphone error: ${err.message}`);
  }
}

function stopVoice(sendEnd = true) {
  if (!isRecording && !scriptProc) return;
  isRecording = false;

  if (scriptProc) { scriptProc.disconnect(); scriptProc = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

  $micBar.style.width = '0%';
  $btnVoice.classList.remove('recording');
  $btnVoice.textContent = '🎙 Hold to Talk';

  if (sendEnd && ws && ws.readyState === WebSocket.OPEN) {
    send({ type: 'voice_end' });
  }
}

// ─────────────────────────────────────────────────────────────
// Audio resampling utilities
// ─────────────────────────────────────────────────────────────
function downsampleTo16k(samples, fromRate) {
  // Linear interpolation downsample: 48000 → 16000
  const ratio     = fromRate / 16000;
  const outLen    = Math.floor(samples.length / ratio);
  const out       = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const pos = i * ratio;
    const idx = Math.floor(pos);
    const frac = pos - idx;
    const a = samples[idx]     ?? 0;
    const b = samples[idx + 1] ?? 0;
    out[i] = a + frac * (b - a);
  }
  return out;
}

function floatToInt16(float32) {
  const out = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return out;
}

// ─────────────────────────────────────────────────────────────
// PCM playback  (Gemini output: 24 kHz, 16-bit, mono)
// Chunks are scheduled end-to-end with no gap using nextPlayAt.
// ─────────────────────────────────────────────────────────────
function scheduleAudio(buffer) {
  if (!speakerOn) return;

  // Lazily create/resume AudioContext for playback
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  const int16   = new Int16Array(buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) {
    float32[i] = int16[i] / 32768.0;
  }

  // Create an AudioBuffer at Gemini's native 24 kHz
  const audioBuf = audioCtx.createBuffer(1, float32.length, 24000);
  audioBuf.copyToChannel(float32, 0);

  const source = audioCtx.createBufferSource();
  source.buffer = audioBuf;
  source.connect(audioCtx.destination);

  // Schedule to play immediately after the previous chunk
  const startAt = Math.max(audioCtx.currentTime + 0.02, nextPlayAt);
  source.start(startAt);
  nextPlayAt = startAt + audioBuf.duration;
}

// ─────────────────────────────────────────────────────────────
// Speaker toggle
// ─────────────────────────────────────────────────────────────
$togSpk.addEventListener('change', () => {
  speakerOn = $togSpk.checked;
  send({ type: 'set_speaker', enabled: speakerOn });
  if (!speakerOn) nextPlayAt = 0;
  $infoSpk.textContent = speakerOn ? 'on' : 'off';
});

// ─────────────────────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────────────────────
function setStatus(status) {
  $connDot.className  = status;
  $connLabel.textContent = {
    connected:    'Connected',
    connecting:   'Connecting…',
    disconnected: 'Disconnected',
  }[status] ?? status;
}

function setUIConnected(on) {
  $btnConnect.disabled  = on;
  $btnDisc.disabled     = !on;
  $btnVoice.disabled    = !on;
  $btnSend.disabled     = !on;
  $textInput.disabled   = !on;

  if (!on) {
    $infoSess.textContent = '—';
    $infoProj.textContent = '—';
    $infoSpk.textContent  = 'off';
    speakerOn = false;
    $togSpk.checked = false;
    nextPlayAt = 0;
  }
}

function appendMsg(type, label, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${type}`;

  if (label) {
    const lbl = document.createElement('div');
    lbl.className = 'msg-label';
    lbl.textContent = label;
    wrap.appendChild(lbl);
  }

  const content = document.createElement('div');
  content.textContent = text;
  wrap.appendChild(content);

  $messages.appendChild(wrap);
  $messages.scrollTop = $messages.scrollHeight;
}

function logSystem(text, isError = false) {
  const el = document.createElement('div');
  el.className = isError ? 'msg error-msg' : 'msg system';
  el.textContent = text;
  $messages.appendChild(el);
  $messages.scrollTop = $messages.scrollHeight;
}

function logError(msg) { logSystem(`⚠ ${msg}`, true); }

$btnClear.addEventListener('click', () => { $messages.innerHTML = ''; });
</script>

</body>
</html>
